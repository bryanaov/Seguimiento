<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Seguimiento de Rutas - Courier</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase JS SDK (Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    #map { height: 480px; width: 100%; border-radius: 12px; }
    .status-pending { background-color: #FEF08A; color: #854D0E; }
    .status-delivered { background-color: #BBF7D0; color: #166534; }
    .status-failed { background-color: #FECACA; color: #991B1B; }
    .status-absent { background-color: #E2E8F0; color: #475569; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- ENCABEZADO -->
  <header class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-truck-fast"></i> Courier Tracker
      </h1>
      <div class="flex gap-2">
        <button onclick="switchTab('driver')" id="btnTabDriver" class="px-3 py-1.5 rounded-lg bg-indigo-900 text-white text-sm font-semibold hover:bg-indigo-800">
          <i class="fa-solid fa-mobile-screen"></i> Modo Chofer
        </button>
        <button onclick="switchTab('admin')" id="btnTabAdmin" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-500">
          <i class="fa-solid fa-map-location-dot"></i> Vista Admin
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">

    <!-- VISTA CHOFER (MÓVIL) -->
    <section id="viewDriver" class="block space-y-4">
      <div class="bg-white p-5 rounded-xl shadow">
        <h2 class="text-lg font-bold mb-3 flex items-center gap-2 text-indigo-700">
          <i class="fa-solid fa-id-card"></i> Acceso a Ruta de Reparto
        </h2>
        <div class="flex gap-2">
          <input type="text" id="inputRouteCode" placeholder="Ingresa tu código de ruta (ej: 14)" class="flex-1 border rounded-lg px-3 py-2 text-lg uppercase font-bold text-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none">
          <button onclick="loadDriverRoute()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-bold hover:bg-indigo-700 transition">
            Cargar
          </button>
        </div>
      </div>

      <!-- PANEL DE RUTA CARGADA -->
      <div id="driverRouteContainer" class="hidden space-y-4">
        <!-- BARRA GPS Y ESTADÍSTICAS -->
        <div class="bg-white p-4 rounded-xl shadow flex flex-col md:flex-row justify-between items-center gap-3">
          <div>
            <h3 class="font-bold text-gray-800 text-lg" id="driverRouteTitle">Ruta #</h3>
            <p class="text-sm text-gray-500" id="driverStats">0 Pendientes / 0 Entregados</p>
          </div>
          <button id="btnToggleGPS" onclick="toggleGPSTracking()" class="w-full md:w-auto px-4 py-2.5 rounded-xl font-bold bg-emerald-600 text-white hover:bg-emerald-700 flex items-center justify-center gap-2 shadow">
            <i class="fa-solid fa-location-crosshairs"></i> Activar Transmisión GPS
          </button>
        </div>

        <div id="gpsStatusText" class="text-xs text-center font-medium text-gray-500 hidden">
          📡 GPS inactivo
        </div>

        <!-- LISTA DE CLIENTES -->
        <div class="bg-white p-4 rounded-xl shadow">
          <h4 class="font-bold text-gray-700 mb-3 border-b pb-2">Clientes en la Ruta</h4>
          <div id="driverClientsList" class="space-y-3">
            <!-- Render dinámico de clientes -->
          </div>
        </div>
      </div>
    </section>

    <!-- VISTA ADMINISTRADOR (MAPA + CARGAR CSV) -->
    <section id="viewAdmin" class="hidden space-y-4">
      <!-- CARGAR CSV -->
      <div class="bg-white p-5 rounded-xl shadow space-y-3">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-file-csv text-emerald-600"></i> Cargar Archivo de Rutas (CSV)
        </h2>
        <p class="text-xs text-gray-500">
          Soporta archivos separados por <code>;</code> o <code>,</code>. Mapea columnas <b>TPT</b>, <b>SEC</b>, <b>RAZON SOCIAL</b>, <b>Y (Latitud)</b>, <b>X (Longitud)</b> automáticamente.
        </p>
        <div class="flex flex-col sm:flex-row gap-3 items-center">
          <input type="file" id="inputCsvFile" accept=".csv, .txt" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          <button onclick="processAndUploadCSV()" class="w-full sm:w-auto px-6 py-2 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700 shadow whitespace-nowrap">
            Procesar y Guardar
          </button>
        </div>
        <div id="csvStatus" class="text-sm font-medium"></div>
      </div>

      <!-- SELECCIONAR RUTA Y MAPA -->
      <div class="bg-white p-4 rounded-xl shadow space-y-3">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
          <h3 class="font-bold text-gray-800">Monitoreo en Tiempo Real</h3>
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <label class="text-xs font-bold text-gray-600">Filtrar Ruta:</label>
            <select id="selectAdminRoute" onchange="onAdminRouteSelect()" class="border rounded-lg px-3 py-1.5 font-bold text-gray-700 outline-none w-full sm:w-auto">
              <option value="">-- Seleccionar Ruta --</option>
            </select>
          </div>
        </div>

        <div id="map"></div>
      </div>
    </section>

  </main>

  <!-- JAVASCRIPT PRINCIPAL -->
  <script>
    // 1. CONFIGURACIÓN FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyACnclacLssdaufRdZxoiBkmfCFfGdoZiE",
      authDomain: "courier-4ecda.firebaseapp.com",
      projectId: "courier-4ecda",
      storageBucket: "courier-4ecda.firebasestorage.app",
      messagingSenderId: "226032355815",
      appId: "1:226032355815:web:0e7e78e217ca77363a1542",
      measurementId: "G-899HW8W4XJ"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // VARIABLES GLOBALES
    let currentRouteCode = null;
    let currentClientsData = [];
    let driverUnsubscribe = null;
    let gpsWatchId = null;
    let map = null;
    let mapMarkers = [];
    let truckMarker = null;
    let adminTrackingUnsubscribe = null;

    // INICIALIZACIÓN MAPA LEAFLET
    function initMap() {
      if (!map) {
        map = L.map('map').setView([-16.3988, -71.5350], 13); // Arequipa por defecto
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(map);
      }
    }

    // CAMBIO DE PESTAÑA (CHOFER / ADMIN)
    function switchTab(tab) {
      document.getElementById('viewDriver').classList.toggle('hidden', tab !== 'driver');
      document.getElementById('viewAdmin').classList.toggle('hidden', tab !== 'admin');
      
      if (tab === 'admin') {
        setTimeout(() => {
          initMap();
          map.invalidateSize();
          loadAvailableRoutesInSelect();
        }, 100);
      }
    }

    // -------------------------------------------------------------
    // LECTOR DE CSV ESTRUCTURADO (PROCESAMIENTO DE RUTA)
    // -------------------------------------------------------------
    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length === 0) return [];

      // Detección automática del separador (; o , o \t)
      const firstLine = lines[0];
      let delimiter = ';';
      const countSemicolon = (firstLine.match(/;/g) || []).length;
      const countComma = (firstLine.match(/,/g) || []).length;
      if (countComma > countSemicolon) delimiter = ',';

      function parseRow(rowStr) {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < rowStr.length; i++) {
          const char = rowStr[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === delimiter && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current.trim());
        return result;
      }

      const headers = parseRow(lines[0]).map(h => h.replace(/^[\uFEFF\s"']+|[\s"']+$/g, '').toUpperCase());

      // Helper para buscar índices por variaciones de nombre de columna
      const getIndex = (names) => headers.findIndex(h => names.some(n => h === n || h.includes(n)));

      const idxTpt = getIndex(['TPT', 'RUTA', 'TRANSPORTISTA', 'CHOFER', 'CODIGO']);
      const idxSec = getIndex(['SEC', 'SECUENCIA', 'ORDEN']);
      const idxVend = getIndex(['VENDEDOR', 'VEND']);
      const idxName = getIndex(['RAZON SOCIAL', 'NAME', 'CLIENTE', 'NOMBRE']);
      const idxTel = getIndex(['TELEFONO', 'TEL', 'CELULAR']);
      const idxDom = getIndex(['DOMICILIO', 'DIRECCION', 'ADDRESS']);
      const idxSub = getIndex(['SUBTOTAL FINAL', 'SUBTOTAL', 'MONTO']);
      const idxY = getIndex(['Y', 'LAT', 'LATITUD']);
      const idxX = getIndex(['X', 'LON', 'LONGITUD']);
      const idxEstado = getIndex(['ESTADO', 'STATUS']);

      const clients = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = parseRow(lines[i]);
        if (cols.length < 2) continue;

        const tpt = idxTpt !== -1 ? cols[idxTpt] : 'DEFAULT';
        if (!tpt) continue;

        let lat = idxY !== -1 ? parseFloat(cols[idxY].replace(',', '.')) : NaN;
        let lon = idxX !== -1 ? parseFloat(cols[idxX].replace(',', '.')) : NaN;

        if (isNaN(lat) || isNaN(lon)) {
          lat = 0;
          lon = 0;
        }

        clients.push({
          tpt: tpt.toString().trim(),
          sec: idxSec !== -1 ? parseInt(cols[idxSec]) || i : i,
          vendedor: idxVend !== -1 ? cols[idxVend] : '',
          name: idxName !== -1 ? cols[idxName] : 'Cliente ' + i,
          telefono: idxTel !== -1 ? cols[idxTel] : '',
          domicilio: idxDom !== -1 ? cols[idxDom] : '',
          subtotal: idxSub !== -1 ? cols[idxSub] : '0.00',
          lat: lat,
          lon: lon,
          estado: (idxEstado !== -1 && cols[idxEstado]) ? cols[idxEstado].toUpperCase() : 'PENDIENTE',
          horaEntrega: '',
          observacion: ''
        });
      }
      return clients;
    }

    // CARGAR Y GUARDAR CSV EN FIRESTORE
    async function processAndUploadCSV() {
      const fileInput = document.getElementById('inputCsvFile');
      const statusDiv = document.getElementById('csvStatus');

      if (!fileInput.files || fileInput.files.length === 0) {
        statusDiv.className = "text-sm font-bold text-red-600";
        statusDiv.innerText = "Por favor selecciona un archivo .csv";
        return;
      }

      statusDiv.className = "text-sm font-bold text-indigo-600";
      statusDiv.innerText = "⏳ Procesando archivo y guardando en la nube...";

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async (e) => {
        try {
          const content = e.target.result;
          const parsedClients = parseCSV(content);

          if (parsedClients.length === 0) {
            statusDiv.className = "text-sm font-bold text-red-600";
            statusDiv.innerText = "No se pudieron extraer datos del archivo.";
            return;
          }

          // Agrupar clientes por código de ruta (TPT)
          const routesMap = {};
          parsedClients.forEach(client => {
            if (!routesMap[client.tpt]) routesMap[client.tpt] = [];
            routesMap[client.tpt].push(client);
          });

          // Guardar cada ruta en Firestore
          const routeKeys = Object.keys(routesMap);
          for (const code of routeKeys) {
            const clientsGroup = routesMap[code];
            clientsGroup.sort((a, b) => a.sec - b.sec);

            await db.collection('routes').doc(code).set({
              code: code,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              clients: clientsGroup
            }, { merge: true });
          }

          statusDiv.className = "text-sm font-bold text-emerald-600";
          statusDiv.innerText = `✅ ¡Éxito! Se guardaron ${parsedClients.length} clientes en ${routeKeys.length} rutas (${routeKeys.join(', ')}).`;

          loadAvailableRoutesInSelect();
        } catch (err) {
          console.error(err);
          statusDiv.className = "text-sm font-bold text-red-600";
          statusDiv.innerText = `Error al procesar: ${err.message}`;
        }
      };

      reader.readAsText(file, 'UTF-8');
    }

    // -------------------------------------------------------------
    // LÓGICA MÓVIL DE CHOFER
    // -------------------------------------------------------------
    function loadDriverRoute() {
      const code = document.getElementById('inputRouteCode').value.trim();
      if (!code) {
        alert("Ingresa un código de ruta válido.");
        return;
      }

      currentRouteCode = code;
      const container = document.getElementById('driverRouteContainer');
      const title = document.getElementById('driverRouteTitle');
      title.innerText = `Ruta #${currentRouteCode}`;

      container.classList.remove('hidden');

      if (driverUnsubscribe) driverUnsubscribe();

      // Escuchar cambios en tiempo real
      driverUnsubscribe = db.collection('routes').doc(currentRouteCode).onSnapshot(doc => {
        if (!doc.exists) {
          document.getElementById('driverClientsList').innerHTML = `<p class="text-red-500 font-bold p-3 text-center">No existe la ruta #${currentRouteCode}. Asegúrate de haber subido el archivo CSV en la pestaña Admin.</p>`;
          document.getElementById('driverStats').innerText = "0 clientes";
          return;
        }

        const data = doc.data();
        currentClientsData = data.clients || [];
        renderDriverClients(currentClientsData);
      });
    }

    function renderDriverClients(clients) {
      const listContainer = document.getElementById('driverClientsList');
      listContainer.innerHTML = '';

      let pendingCount = 0;
      let deliveredCount = 0;

      clients.forEach((c, index) => {
        if (c.estado === 'ENTREGADO') deliveredCount++;
        else pendingCount++;

        let badgeClass = 'status-pending';
        if (c.estado === 'ENTREGADO') badgeClass = 'status-delivered';
        if (c.estado === 'NO ENTREGADO') badgeClass = 'status-failed';
        if (c.estado === 'AUSENTE') badgeClass = 'status-absent';

        const card = document.createElement('div');
        card.className = "border rounded-xl p-4 bg-gray-50 space-y-2 shadow-sm";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <span class="font-bold text-indigo-700 text-sm">#${c.sec} · ${c.name}</span>
            <span class="status-badge ${badgeClass}">${c.estado || 'PENDIENTE'}</span>
          </div>
          <p class="text-xs text-gray-600"><i class="fa-solid fa-location-dot text-red-500"></i> ${c.domicilio}</p>
          <p class="text-xs text-gray-500"><i class="fa-solid fa-phone text-emerald-500"></i> ${c.telefono || 'Sin teléfono'} | S/ ${c.subtotal}</p>

          <div class="flex flex-wrap gap-2 pt-2 border-t">
            <a href="https://waze.com/ul?ll=${c.lat},${c.lon}&navigate=yes" target="_blank" class="px-2.5 py-1 text-xs font-bold bg-sky-500 text-white rounded hover:bg-sky-600">
              <i class="fa-brands fa-waze"></i> Waze
            </a>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lon}" target="_blank" class="px-2.5 py-1 text-xs font-bold bg-emerald-600 text-white rounded hover:bg-emerald-700">
              <i class="fa-solid fa-map-pin"></i> Maps
            </a>
            <select onchange="updateClientStatus(${index}, this.value)" class="ml-auto text-xs font-bold border rounded px-2 py-1 bg-white outline-none">
              <option value="PENDIENTE" ${c.estado === 'PENDIENTE' ? 'selected' : ''}>⏳ PENDIENTE</option>
              <option value="ENTREGADO" ${c.estado === 'ENTREGADO' ? 'selected' : ''}>✅ ENTREGADO</option>
              <option value="NO ENTREGADO" ${c.estado === 'NO ENTREGADO' ? 'selected' : ''}>❌ NO ENTREGADO</option>
              <option value="AUSENTE" ${c.estado === 'AUSENTE' ? 'selected' : ''}>🏠 AUSENTE</option>
            </select>
          </div>
        `;
        listContainer.appendChild(card);
      });

      document.getElementById('driverStats').innerText = `${pendingCount} Pendientes / ${deliveredCount} Entregados`;
    }

    async function updateClientStatus(index, newStatus) {
      if (!currentRouteCode || !currentClientsData[index]) return;

      currentClientsData[index].estado = newStatus;
      if (newStatus === 'ENTREGADO') {
        currentClientsData[index].horaEntrega = new Date().toLocaleTimeString();
      }

      await db.collection('routes').doc(currentRouteCode).update({
        clients: currentClientsData,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    // TRANSMISIÓN GPS DEL CHOFER
    function toggleGPSTracking() {
      const btn = document.getElementById('btnToggleGPS');
      const statusText = document.getElementById('gpsStatusText');

      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        btn.innerHTML = `<i class="fa-solid fa-location-crosshairs"></i> Activar Transmisión GPS`;
        btn.className = "w-full md:w-auto px-4 py-2.5 rounded-xl font-bold bg-emerald-600 text-white hover:bg-emerald-700 flex items-center justify-center gap-2 shadow";
        statusText.classList.add('hidden');
        return;
      }

      if (!navigator.geolocation) {
        alert("Tu dispositivo no soporta geolocalización.");
        return;
      }

      statusText.classList.remove('hidden');
      statusText.innerText = "📡 Buscando señal GPS...";

      gpsWatchId = navigator.geolocation.watchPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          db.collection('tracking').doc(currentRouteCode).set({
            code: currentRouteCode,
            lat: lat,
            lng: lng,
            timestamp: Date.now(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          statusText.innerText = `📡 Transmitiendo GPS en vivo (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
          btn.innerHTML = `<i class="fa-solid fa-circle-stop"></i> Detener GPS`;
          btn.className = "w-full md:w-auto px-4 py-2.5 rounded-xl font-bold bg-rose-600 text-white hover:bg-rose-700 flex items-center justify-center gap-2 shadow";
        },
        error => {
          statusText.innerText = `⚠️ Error GPS: ${error.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    // -------------------------------------------------------------
    // VISTA Y MONITOREO DE ADMINISTRADOR
    // -------------------------------------------------------------
    async function loadAvailableRoutesInSelect() {
      const select = document.getElementById('selectAdminRoute');
      select.innerHTML = '<option value="">-- Seleccionar Ruta --</option>';

      const snapshot = await db.collection('routes').get();
      snapshot.forEach(doc => {
        const option = document.createElement('option');
        option.value = doc.id;
        option.innerText = `Ruta #${doc.id}`;
        select.appendChild(option);
      });
    }

    function onAdminRouteSelect() {
      const code = document.getElementById('selectAdminRoute').value;
      if (!code) return;

      // Limpiar marcadores anteriores
      mapMarkers.forEach(m => map.removeLayer(m));
      mapMarkers = [];
      if (truckMarker) {
        map.removeLayer(truckMarker);
        truckMarker = null;
      }

      // Escuchar clientes de la ruta
      db.collection('routes').doc(code).onSnapshot(doc => {
        if (!doc.exists) return;
        const clients = doc.data().clients || [];

        mapMarkers.forEach(m => map.removeLayer(m));
        mapMarkers = [];

        const bounds = [];

        clients.forEach(c => {
          if (!c.lat || !c.lon) return;

          let color = '#EAB308'; // Pendiente (Amarillo)
          if (c.estado === 'ENTREGADO') color = '#22C55E'; // Verde
          if (c.estado === 'NO ENTREGADO') color = '#EF4444'; // Rojo
          if (c.estado === 'AUSENTE') color = '#64748B'; // Gris

          const marker = L.circleMarker([c.lat, c.lon], {
            radius: 8,
            fillColor: color,
            color: '#ffffff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map);

          marker.bindPopup(`
            <b>#${c.sec} · ${c.name}</b><br>
            ${c.domicilio}<br>
            <b>Estado:</b> ${c.estado || 'PENDIENTE'}
          `);

          mapMarkers.push(marker);
          bounds.push([c.lat, c.lon]);
        });

        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [30, 30] });
        }
      });

      // Escuchar GPS del camión en tiempo real
      if (adminTrackingUnsubscribe) adminTrackingUnsubscribe();
      adminTrackingUnsubscribe = db.collection('tracking').doc(code).onSnapshot(doc => {
        if (!doc.exists) return;
        const data = doc.data();
        if (!data.lat || !data.lng) return;

        if (!truckMarker) {
          const truckIcon = L.divIcon({
            html: '<div style="background:#4F46E5;color:white;padding:6px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4);"><i class="fa-solid fa-truck"></i></div>',
            className: '',
            iconSize: [30, 30]
          });
          truckMarker = L.marker([data.lat, data.lng], { icon: truckIcon }).addTo(map);
        } else {
          truckMarker.setLatLng([data.lat, data.lng]);
        }
      });
    }
  </script>
</body>
</html>
